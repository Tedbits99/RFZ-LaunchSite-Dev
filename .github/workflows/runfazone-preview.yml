name: Runfazone private preview

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: 'Exact approved PR #14 head SHA'
        required: true
        type: string
      operation:
        description: 'Run credential/configuration preflight, or explicitly deploy the private preview'
        required: true
        type: choice
        options:
          - preflight
        default: preflight

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: runfazone-private-preview
  cancel-in-progress: false

jobs:
  verify-approved-head:
    name: Verify PR #14 Gate A
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      head_sha: ${{ steps.verify.outputs.head_sha }}
    steps:
      - id: verify
        name: Verify exact PR head and required checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          APPROVED_SHA: ${{ inputs.head_sha }}
          APPROVED_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "Tedbits99/RFZ-LaunchSite-Dev" ]] || {
            echo 'BLOCKED: preview workflow is restricted to the approved repository.' >&2
            exit 1
          }
          [[ "$APPROVED_BRANCH" == "codex/uiux-007-continuation" ]] || {
            echo 'BLOCKED: preview workflow must be dispatched from codex/uiux-007-continuation.' >&2
            exit 1
          }
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'BLOCKED: head_sha must be a full commit SHA.' >&2
            exit 1
          }

          pr_json="$(gh api "repos/$REPOSITORY/pulls/14")"
          pr_state="$(jq -r '.state' <<<"$pr_json")"
          pr_draft="$(jq -r '.draft' <<<"$pr_json")"
          pr_base="$(jq -r '.base.ref' <<<"$pr_json")"
          pr_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          pr_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          [[ "$pr_state" == open && "$pr_draft" == true && "$pr_base" == main ]] || {
            echo 'BLOCKED: PR #14 must be open, draft, and target main.' >&2
            exit 1
          }
          [[ "$pr_repo" == "$REPOSITORY" && "$pr_sha" == "$APPROVED_SHA" ]] || {
            echo 'BLOCKED: PR #14 is not a trusted same-repository exact-head match.' >&2
            exit 1
          }

          checks_json="$(gh api "repos/$REPOSITORY/commits/$APPROVED_SHA/check-runs?per_page=100")"
          required=("Next.js checks" "Isolated Supabase RPC security tests" "Production release safety")
          for check_name in "${required[@]}"; do
            count="$(jq --arg name "$check_name" '[.check_runs[] | select(.name == $name and .conclusion == "success")] | length' <<<"$checks_json")"
            [[ "$count" == 1 ]] || {
              echo "BLOCKED: required Gate A check is not exactly successful on the approved head: $check_name" >&2
              exit 1
            }
          done

          echo "Verified PR #14 exact head $APPROVED_SHA with all required Gate A checks successful."
          echo "head_sha=$APPROVED_SHA" >> "$GITHUB_OUTPUT"

  build-preview:
    name: Build approved preview artifact
    needs: verify-approved-head
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out approved PR #14 head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-approved-head.outputs.head_sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext Worker
        run: npm run cloudflare:build

      - name: Verify preview target and package contents
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "runfazone-preview"' wrangler.jsonc
          test -s .open-next/worker.js
          if rg -n --hidden --glob '!node_modules/**' --glob '!.git/**' \
            '(SUPABASE_SERVICE_ROLE_KEY|PAYMONGO_SECRET_KEY|FAZERCARDS_API_KEY|SMTP_PASSWORD)=' \
            .open-next; then
            echo 'BLOCKED: privileged environment variable assignment found in preview artifact.' >&2
            exit 1
          fi

      - name: Upload immutable preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: runfazone-preview-${{ needs.verify-approved-head.outputs.head_sha }}
          include-hidden-files: true
          path: |
            .open-next/**
            wrangler.jsonc
          if-no-files-found: error

  cloudflare-preflight:
    name: Verify scoped Cloudflare preview credentials
    needs: [verify-approved-head, build-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: runfazone-preview
    permissions:
      contents: read
    steps:
      - name: Download approved preview artifact
        uses: actions/download-artifact@v4
        with:
          name: runfazone-preview-${{ needs.verify-approved-head.outputs.head_sha }}

      - name: Verify scoped credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'BLOCKED: runfazone-preview.CLOUDFLARE_API_TOKEN is missing.' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'BLOCKED: runfazone-preview.CLOUDFLARE_ACCOUNT_ID variable or secret is missing.' >&2; exit 1; }

      - name: Verify Cloudflare token status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          verify_json="$RUNNER_TEMP/cloudflare-token-verify.json"
          http_status=000
          for delay in 0 2 5; do
            if (( delay > 0 )); then sleep "$delay"; fi
            set +e
            http_status="$(curl --silent --show-error --max-time 20 \
              --output "$verify_json" --write-out '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              'https://api.cloudflare.com/client/v4/user/tokens/verify')"
            curl_exit=$?
            set -e
            if (( curl_exit == 0 )); then break; fi
            http_status=000
          done

          if [[ "$http_status" =~ ^(401|403)$ ]]; then
            api_code="$(jq -r '.errors[0].code // "unknown"' "$verify_json" 2>/dev/null || echo unknown)"
            echo "TOKEN_INVALID: Cloudflare token verification rejected the credential (HTTP $http_status, API code $api_code)." >&2
            exit 1
          fi
          [[ "$http_status" =~ ^2 ]] || {
            echo "TOKEN_VERIFICATION_FAILED: Cloudflare token endpoint did not return success (HTTP ${http_status:-unknown})." >&2
            exit 1
          }
          jq -e '.success == true and .result.status == "active"' "$verify_json" >/dev/null || {
            token_status="$(jq -r '.result.status // "unknown"' "$verify_json" 2>/dev/null || echo unknown)"
            echo "TOKEN_INVALID: Cloudflare token is not active (status $token_status)." >&2
            exit 1
          }
          echo "Cloudflare token verification passed (HTTP $http_status, status active)."

      - name: Verify Cloudflare identity, permissions, and preview target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.name' wrangler.jsonc)" = runfazone-preview
          account_http="$(curl --silent --show-error --max-time 20 \
            --output "$RUNNER_TEMP/cloudflare-account.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")" || account_http=000
          [[ "$account_http" =~ ^2 ]] || {
            api_code="$(jq -r '.errors[0].code // "unknown"' "$RUNNER_TEMP/cloudflare-account.json" 2>/dev/null || echo unknown)"
            if [[ "$account_http" == 403 ]]; then
              echo "INSUFFICIENT_PERMISSIONS: Cloudflare account verification was denied (HTTP $account_http, API code $api_code)." >&2
            else
              echo "ACCOUNT_MISMATCH_OR_UNAVAILABLE: Cloudflare account verification failed (HTTP $account_http, API code $api_code)." >&2
            fi
            exit 1
          }
          jq -e '.success == true' "$RUNNER_TEMP/cloudflare-account.json" >/dev/null || {
            echo 'ACCOUNT_MISMATCH_OR_UNAVAILABLE: Cloudflare account response was not successful.' >&2
            exit 1
          }
          whoami_log="$RUNNER_TEMP/wrangler-whoami.log"
          if ! npx --yes wrangler@4.151.3 whoami >"$whoami_log" 2>&1; then
            echo 'TOKEN_VALID_BUT_WRANGLER_FAILS: Cloudflare token and account endpoint passed, but Wrangler identity verification failed.' >&2
            exit 1
          fi
          echo 'Cloudflare account, Wrangler identity, and preview target verification passed; response details redacted.'

