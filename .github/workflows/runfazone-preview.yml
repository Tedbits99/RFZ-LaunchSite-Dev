name: Runfazone private preview

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: 'Exact approved PR #14 head SHA'
        required: true
        type: string
      operation:
        description: 'Run credential/configuration preflight, or explicitly deploy the private preview'
        required: true
        type: choice
        options:
          - preflight
          - deploy-private-preview
        default: preflight
      gate_b_audit_run_id:
        description: 'Successful Gate B hosted audit run on main (required for deployment)'
        required: false
        default: '40175163923'
        type: string

permissions:
  contents: read
  checks: read
  actions: read
  pull-requests: read

concurrency:
  group: runfazone-private-preview
  cancel-in-progress: false

jobs:
  verify-approved-head:
    name: Verify PR #14 Gate A
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      head_sha: ${{ steps.verify.outputs.head_sha }}
    steps:
      - id: verify
        name: Verify exact PR head and required checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          APPROVED_SHA: ${{ inputs.head_sha }}
          APPROVED_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "Tedbits99/RFZ-LaunchSite-Dev" ]] || {
            echo 'BLOCKED: preview workflow is restricted to the approved repository.' >&2
            exit 1
          }
          [[ "$APPROVED_BRANCH" == "main" ]] || {
            echo 'BLOCKED: protected preview workflow must be dispatched from trusted main.' >&2
            exit 1
          }
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'BLOCKED: head_sha must be a full commit SHA.' >&2
            exit 1
          }

          pr_json="$(gh api "repos/$REPOSITORY/pulls/14")"
          pr_state="$(jq -r '.state' <<<"$pr_json")"
          pr_draft="$(jq -r '.draft' <<<"$pr_json")"
          pr_base="$(jq -r '.base.ref' <<<"$pr_json")"
          pr_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          pr_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          [[ "$pr_state" == open && "$pr_draft" == true && "$pr_base" == main ]] || {
            echo 'BLOCKED: PR #14 must be open, draft, and target main.' >&2
            exit 1
          }
          [[ "$pr_repo" == "$REPOSITORY" && "$pr_sha" == "$APPROVED_SHA" ]] || {
            echo 'BLOCKED: PR #14 is not a trusted same-repository exact-head match.' >&2
            exit 1
          }

          checks_json="$(gh api "repos/$REPOSITORY/commits/$APPROVED_SHA/check-runs?per_page=100")"
          required=("Next.js checks" "Isolated Supabase RPC security tests" "Production release safety")
          for check_name in "${required[@]}"; do
            count="$(jq --arg name "$check_name" '[.check_runs[] | select(.name == $name and .conclusion == "success")] | length' <<<"$checks_json")"
            [[ "$count" == 1 ]] || {
              echo "BLOCKED: required Gate A check is not exactly successful on the approved head: $check_name" >&2
              exit 1
            }
          done

          echo "Verified PR #14 exact head $APPROVED_SHA with all required Gate A checks successful."
          echo "head_sha=$APPROVED_SHA" >> "$GITHUB_OUTPUT"

  verify-gate-b-audit:
    name: Verify Gate B hosted audit evidence
    needs: verify-approved-head
    if: inputs.operation == 'deploy-private-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify successful audit run from main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          AUDIT_RUN_ID: ${{ inputs.gate_b_audit_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUDIT_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo 'BLOCKED: gate_b_audit_run_id must be a numeric GitHub Actions run ID.' >&2
            exit 1
          }
          audit_json="$(gh run view "$AUDIT_RUN_ID" --repo "$REPOSITORY" --json conclusion,status,headBranch,event,workflowName)"
          jq -e '
            .conclusion == "success"
            and .status == "completed"
            and .headBranch == "main"
            and .event == "workflow_dispatch"
            and .workflowName == "Runfazone development database synchronization"
          ' <<<"$audit_json" >/dev/null || {
            echo 'BLOCKED: the supplied Gate B hosted audit run is not a completed successful main-branch database audit.' >&2
            exit 1
          }
          audit_log="$RUNNER_TEMP/gate-b-audit.log"
          gh run view "$AUDIT_RUN_ID" --repo "$REPOSITORY" --log >"$audit_log"
          for marker in \
            HOSTED_PRIVILEGED_RPC_AUDIT_PASS \
            HOSTED_EDGE_FUNCTION_INVENTORY_PASS \
            HOSTED_INTEGRATION_AUDIT_PASS \
            HOSTED_DISPOSABLE_RESTORE_PASS; do
            grep -Fq -- "$marker" "$audit_log" || {
              echo "BLOCKED: Gate B audit run is missing required evidence marker $marker." >&2
              exit 1
            }
          done
          echo "Verified Gate B hosted audit run $AUDIT_RUN_ID; response details redacted."

  build-preview:
    name: Build approved preview artifact
    needs: verify-approved-head
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: runfazone-preview
    steps:
      - name: Check out approved PR #14 head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-approved-head.outputs.head_sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify development public configuration is present
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo 'BLOCKED: development NEXT_PUBLIC_SUPABASE_URL is missing from runfazone-preview.' >&2; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo 'BLOCKED: development NEXT_PUBLIC_SUPABASE_ANON_KEY is missing from runfazone-preview.' >&2; exit 1; }
          [[ "$NEXT_PUBLIC_SUPABASE_URL" == https://ketdhcmwowzztcdlmris.supabase.co ]] || {
            echo 'BLOCKED: preview build is not bound to the approved development Supabase project.' >&2
            exit 1
          }

      - name: Build OpenNext Worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run cloudflare:build

      - name: Verify preview target and package contents
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "runfazone-preview"' wrangler.jsonc
          test -s .open-next/worker.js
          if grep -R -n -E --exclude-dir=node_modules --exclude-dir=.git \
            '(SUPABASE_SERVICE_ROLE_KEY|PAYMONGO_SECRET_KEY|FAZERCARDS_API_KEY|SMTP_PASSWORD)=' \
            .open-next; then
            echo 'BLOCKED: privileged environment variable assignment found in preview artifact.' >&2
            exit 1
          fi

      - name: Upload immutable preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: runfazone-preview-${{ needs.verify-approved-head.outputs.head_sha }}
          include-hidden-files: true
          path: |
            .open-next/**
            wrangler.jsonc
          if-no-files-found: error

  cloudflare-preflight:
    name: Verify scoped Cloudflare preview credentials
    needs: [verify-approved-head, build-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: runfazone-preview
    permissions:
      contents: read
    steps:
      - name: Download approved preview artifact
        uses: actions/download-artifact@v4
        with:
          name: runfazone-preview-${{ needs.verify-approved-head.outputs.head_sha }}

      - name: Verify scoped credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'BLOCKED: runfazone-preview.CLOUDFLARE_API_TOKEN is missing.' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'BLOCKED: runfazone-preview.CLOUDFLARE_ACCOUNT_ID variable or secret is missing.' >&2; exit 1; }

      - name: Verify Cloudflare token status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          verify_json="$RUNNER_TEMP/cloudflare-token-verify.json"
          http_status=000
          for delay in 0 2 5; do
            if (( delay > 0 )); then sleep "$delay"; fi
            set +e
            http_status="$(curl --silent --show-error --max-time 20 \
              --output "$verify_json" --write-out '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              'https://api.cloudflare.com/client/v4/user/tokens/verify')"
            curl_exit=$?
            set -e
            if (( curl_exit == 0 )); then break; fi
            http_status=000
          done

          if [[ "$http_status" =~ ^(401|403)$ ]]; then
            api_code="$(jq -r '.errors[0].code // "unknown"' "$verify_json" 2>/dev/null || echo unknown)"
            echo "TOKEN_INVALID: Cloudflare token verification rejected the credential (HTTP $http_status, API code $api_code)." >&2
            exit 1
          fi
          [[ "$http_status" =~ ^2 ]] || {
            echo "TOKEN_VERIFICATION_FAILED: Cloudflare token endpoint did not return success (HTTP ${http_status:-unknown})." >&2
            exit 1
          }
          jq -e '.success == true and .result.status == "active"' "$verify_json" >/dev/null || {
            token_status="$(jq -r '.result.status // "unknown"' "$verify_json" 2>/dev/null || echo unknown)"
            echo "TOKEN_INVALID: Cloudflare token is not active (status $token_status)." >&2
            exit 1
          }
          echo "Cloudflare token verification passed (HTTP $http_status, status active)."

      - name: Verify Cloudflare identity, permissions, and preview target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.name' wrangler.jsonc)" = runfazone-preview
          account_http="$(curl --silent --show-error --max-time 20 \
            --output "$RUNNER_TEMP/cloudflare-account.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")" || account_http=000
          [[ "$account_http" =~ ^2 ]] || {
            api_code="$(jq -r '.errors[0].code // "unknown"' "$RUNNER_TEMP/cloudflare-account.json" 2>/dev/null || echo unknown)"
            if [[ "$account_http" == 403 ]]; then
              echo "INSUFFICIENT_PERMISSIONS: Cloudflare account verification was denied (HTTP $account_http, API code $api_code)." >&2
            else
              echo "ACCOUNT_MISMATCH_OR_UNAVAILABLE: Cloudflare account verification failed (HTTP $account_http, API code $api_code)." >&2
            fi
            exit 1
          }
          jq -e '.success == true' "$RUNNER_TEMP/cloudflare-account.json" >/dev/null || {
            echo 'ACCOUNT_MISMATCH_OR_UNAVAILABLE: Cloudflare account response was not successful.' >&2
            exit 1
          }
          whoami_log="$RUNNER_TEMP/wrangler-whoami.log"
          if ! npx --yes wrangler@4.151.3 whoami >"$whoami_log" 2>&1; then
            echo 'TOKEN_VALID_BUT_WRANGLER_FAILS: Cloudflare token and account endpoint passed, but Wrangler identity verification failed.' >&2
            exit 1
          fi
          echo 'Cloudflare account, Wrangler identity, and preview target verification passed; response details redacted.'

  verify-cloudflare-access:
    name: Verify saved Cloudflare Access protection
    needs: [verify-approved-head, build-preview, cloudflare-preflight, verify-gate-b-audit]
    if: inputs.operation == 'deploy-private-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: runfazone-preview
    permissions:
      contents: read
    steps:
      - name: Check out trusted main verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify account-wide owner-only Access policy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/verify-cloudflare-access-policy.sh

  deploy-private-preview:
    name: Deploy protected private preview
    needs: [verify-approved-head, build-preview, cloudflare-preflight, verify-gate-b-audit, verify-cloudflare-access]
    if: inputs.operation == 'deploy-private-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: runfazone-preview
    permissions:
      contents: read
    outputs:
      worker_url: ${{ steps.urls.outputs.worker_url }}
      version_url: ${{ steps.urls.outputs.version_url }}
    steps:
      - name: Download approved immutable artifact
        uses: actions/download-artifact@v4
        with:
          name: runfazone-preview-${{ needs.verify-approved-head.outputs.head_sha }}

      - name: Verify deployment inputs are development-only
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo 'BLOCKED: development NEXT_PUBLIC_SUPABASE_URL is missing from runfazone-preview.' >&2; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo 'BLOCKED: development SUPABASE_PROJECT_ID is missing from runfazone-preview.' >&2; exit 1; }
          [[ "$SUPABASE_PROJECT_ID" == ketdhcmwowzztcdlmris ]] || {
            echo 'BLOCKED: preview database identity is not the approved development project.' >&2
            exit 1
          }
          [[ "$SUPABASE_URL" == https://ketdhcmwowzztcdlmris.supabase.co ]] || {
            echo 'BLOCKED: preview Supabase URL is not the approved development project URL.' >&2
            exit 1
          }
          if grep -R -n -E --exclude-dir=node_modules --exclude-dir=.git \
            '(SUPABASE_SERVICE_ROLE_KEY|PAYMONGO_SECRET_KEY|PAYMENT_PAYMONGO_SECRET_KEY|FAZERCARDS_API_KEY|SUPPLIER_FAZERCARDS_API_KEY|SMTP_PASSWORD)=' .open-next; then
            echo 'BLOCKED: privileged or provider secret assignment found in immutable preview artifact.' >&2
            exit 1
          fi

      - name: Deploy only the named Worker on workers.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPROVED_SHA: ${{ needs.verify-approved-head.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.name' wrangler.jsonc)" = runfazone-preview
          test "$(jq -r '.main' wrangler.jsonc)" = .open-next/worker.js
          jq -e '((.routes // []) | length == 0) and ((.domains // []) | length == 0) and ((.triggers // {}) | length == 0)' wrangler.jsonc >/dev/null || {
            echo 'BLOCKED: preview configuration contains routes, custom domains, or scheduled triggers.' >&2
            exit 1
          }
          deploy_log="$RUNNER_TEMP/wrangler-deploy.log"
          npx --yes wrangler@4.151.3 deploy --config wrangler.jsonc --no-bundle \
            --name runfazone-preview --message "Runfazone PR14 $APPROVED_SHA" >"$deploy_log" 2>&1
          echo 'Cloudflare Worker deployment completed for runfazone-preview; deployment diagnostics redacted.'

      - name: Resolve normal and immutable version URLs
        id: urls
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          api_root='https://api.cloudflare.com/client/v4'
          headers=( -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' )
          script_json="$RUNNER_TEMP/script.json"
          deployments_json="$RUNNER_TEMP/deployments.json"
          version_json="$RUNNER_TEMP/version.json"
          script_http="$(curl --silent --show-error --max-time 30 --output "$script_json" --write-out '%{http_code}' "${headers[@]}" "$api_root/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          [[ "$script_http" =~ ^2 ]] || { echo "BLOCKED: Worker inventory lookup failed (HTTP $script_http)." >&2; exit 1; }
          jq -e '.success == true' "$script_json" >/dev/null || { echo 'BLOCKED: Worker inventory response was not successful.' >&2; exit 1; }
          worker_url="$(jq -r '[.result[]? | select(.name == "runfazone-preview") | .subdomain.url][0] // empty' "$script_json")"
          test -n "$worker_url" || { echo 'BLOCKED: deployed Worker has no workers.dev URL.' >&2; exit 1; }
          [[ "$worker_url" =~ ^https://runfazone-preview\..+\.workers\.dev$ ]] || { echo 'BLOCKED: Worker URL is not the expected workers.dev hostname.' >&2; exit 1; }

          deployment_http="$(curl --silent --show-error --max-time 30 --output "$deployments_json" --write-out '%{http_code}' "${headers[@]}" "$api_root/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/runfazone-preview/deployments?per_page=1")"
          [[ "$deployment_http" =~ ^2 ]] || { echo "BLOCKED: deployment inventory lookup failed (HTTP $deployment_http)." >&2; exit 1; }
          version_id="$(jq -r '.result.deployments[0].versions[0].version_id // empty' "$deployments_json")"
          test -n "$version_id" || { echo 'BLOCKED: latest deployment did not expose a version ID.' >&2; exit 1; }
          version_http="$(curl --silent --show-error --max-time 30 --output "$version_json" --write-out '%{http_code}' "${headers[@]}" "$api_root/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/runfazone-preview/versions/$version_id")"
          [[ "$version_http" =~ ^2 ]] || { echo "BLOCKED: version URL lookup failed (HTTP $version_http)." >&2; exit 1; }
          version_url="$(jq -r '[.result.urls[]?][0] // empty' "$version_json")"
          test -n "$version_url" || { echo 'BLOCKED: deployed version did not expose an immutable URL.' >&2; exit 1; }
          [[ "$version_url" =~ ^https://.+-runfazone-preview\..+\.workers\.dev$ ]] || { echo 'BLOCKED: version URL is not the expected workers.dev hostname.' >&2; exit 1; }
          printf 'worker_url=%s\n' "$worker_url" >>"$GITHUB_OUTPUT"
          printf 'version_url=%s\n' "$version_url" >>"$GITHUB_OUTPUT"
          echo 'Resolved normal and immutable version URLs; URLs are emitted as workflow outputs for owner review.'

      - name: Verify anonymous requests are denied before app data
        env:
          WORKER_URL: ${{ steps.urls.outputs.worker_url }}
          VERSION_URL: ${{ steps.urls.outputs.version_url }}
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in "$WORKER_URL" "$VERSION_URL"; do
            headers_file="$RUNNER_TEMP/headers"
            body_file="$RUNNER_TEMP/body"
            http="$(curl --silent --show-error --max-time 30 \
              --dump-header "$headers_file" --output "$body_file" --write-out '%{http_code}' "$endpoint/")"
            if [[ "$http" =~ ^2 ]]; then
              echo "BLOCKED: anonymous request reached a successful response at ${endpoint#https://}." >&2
              exit 1
            fi
            if [[ "$http" =~ ^3 ]]; then
              location="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/^[^:]*:[[:space:]]*/, ""); gsub(/[[:space:]]+$/, ""); print; exit }' "$headers_file")"
              test -n "$location" || { echo "BLOCKED: anonymous redirect at ${endpoint#https://} has no Location header." >&2; exit 1; }
              [[ "$location" != "$endpoint"* ]] || { echo "BLOCKED: anonymous redirect loops back to the Worker endpoint." >&2; exit 1; }
            elif [[ ! "$http" =~ ^(401|403)$ ]]; then
              echo "BLOCKED: anonymous request at ${endpoint#https://} returned unexpected HTTP $http." >&2
              exit 1
            fi
            if grep -Ein '(order|payment|customer|profile|supabase|dashboard|admin)' "$body_file"; then
              echo "BLOCKED: anonymous response at ${endpoint#https://} exposed application data markers." >&2
              exit 1
            fi
            echo "Anonymous access denied at ${endpoint#https://} (HTTP $http)."
          done

