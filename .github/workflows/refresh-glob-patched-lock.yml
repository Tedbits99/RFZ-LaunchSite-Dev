name: One-shot patched OpenNext lockfile validation

on:
  push:
    branches: [fix/opennext-164-preview-props]
    paths:
      - '.github/workflows/refresh-glob-patched-lock.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.repository == 'Tedbits99/RFZ-LaunchSite-Dev' && github.ref == 'refs/heads/fix/opennext-164-preview-props'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/opennext-164-preview-props
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Generate lockfile with patched nested glob
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm audit --audit-level=low
          test "$(node -p "require('./package-lock.json').packages['node_modules/@opennextjs/cloudflare'].version")" = 1.20.12
          node - <<'NODE'
          const lock=require('./package-lock.json');
          for(const [name,part] of Object.entries(lock.packages)) {
            if(name.endsWith('node_modules/glob') && part.version.startsWith('10.')) {
              const [major,minor]=part.version.split('.').map(Number);
              if(major===10 && minor<5) throw new Error('Unpatched glob: '+name);
            }
          }
          NODE
      - name: Verify Cloudflare runtime
        env:
          NEXT_PUBLIC_APP_URL: https://runfazone-preview.mondigoted732.workers.dev
        run: |
          npm run cloudflare:build
          bash scripts/test-open-next-runtime.sh
      - name: Commit validated lockfile
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet && { echo 'Expected lockfile change not found'; exit 1; }
          git commit -m 'security: update OpenNext nested glob to patched version'
          git fetch origin fix/opennext-164-preview-props
          git merge --no-edit origin/fix/opennext-164-preview-props
          git push origin HEAD:fix/opennext-164-preview-props
