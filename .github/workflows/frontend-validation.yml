name: Frontend validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nextjs:
    name: Next.js checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify auto-merge discovery safety cases
        run: bash scripts/discover-codex-pr.sh --self-test
      - name: Guard Cloudflare CSS and JavaScript deployment order
        run: node scripts/verify-preview-static-assets.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm test -- --pool=threads --no-file-parallelism --maxWorkers=1
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Build OpenNext Cloudflare bundle when configured
        if: hashFiles('open-next.config.ts', 'wrangler.jsonc') != ''
        run: npm run cloudflare:build
      - name: Verify compiled Tailwind layout utilities
        if: hashFiles('open-next.config.ts', 'wrangler.jsonc') != ''
        run: node scripts/verify-tailwind-output.mjs
