name: Frontend validation

on:
  pull_request:
    paths-ignore:
      - 'supabase/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nextjs:
    name: Next.js checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --pool=threads --no-file-parallelism --maxWorkers=1
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Run ESLint
        run: npm run lint
      - name: Build production app
        run: npm run build
