name: VOUCHERS-001 disposable campaign acceptance

on:
  pull_request:
    branches: [codex/rfz-catalog-multigame-completion]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: vouchers-001-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vouchers-001-disposable-acceptance:
    if: >-
      github.event.pull_request.head.ref == 'codex/rfz-vouchers-001' &&
      github.event.pull_request.base.ref == 'codex/rfz-catalog-multigame-completion'
    name: VOUCHERS PostgreSQL 17, Auth, API and desktop/mobile acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
      CATALOG_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      CATALOG_RUN_TAG: vouchers-${{ github.run_id }}-${{ github.run_attempt }}
      NEXT_TELEMETRY_DISABLED: "1"
      PAYMENT_MODE: mock
      PAYMENT_PROVIDER: mock

    steps:
      - name: Check out exact VOUCHERS-001 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate identity and clean checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          [[ "$HEAD_BRANCH" == codex/rfz-vouchers-001 ]]
          [[ "$BASE_BRANCH" == codex/rfz-catalog-multigame-completion ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          printf 'VOUCHERS_CANDIDATE_SHA=%s\n' "$EXPECTED_SHA"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Install pinned local Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      - name: Install Chromium for desktop/mobile acceptance
        run: npx playwright install --with-deps chromium

      - name: Run isolated full acceptance matrix
        run: bash scripts/vouchers-001/run-local-acceptance.sh

      - name: Upload synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vouchers-001-sanitized-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/vouchers-001/test-output/
          if-no-files-found: warn
          retention-days: 7
