name: Trusted Codex auto-merge

on:
  workflow_run:
    workflows: ["Frontend validation", "Development validation"]
    types: [completed]

permissions:
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: trusted-codex-auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  merge-verified-codex-pr:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/pulls" | jq -r --arg repository "$REPOSITORY" '[.[] | select(.state == "open" and .base.ref == "main" and .head.repo.full_name == $repository and (.head.ref | startswith("codex/")) and .draft == false)] | first | .number // empty')"
          test -n "$pr" || exit 0
          echo "number=$pr" >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Load the verifier only from the trusted default branch; PR code
          # cannot replace the privileged merge policy.
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/verify-auto-merge-gates.sh?ref=main" --jq .content | base64 --decode > "$RUNNER_TEMP/verify.sh"
          bash "$RUNNER_TEMP/verify.sh"
          # Use GitHub CLI's supported native auto-merge path. This never
          # bypasses rules, and match-head-commit pins the request to the
          # exact verified PR head.
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash \
            --match-head-commit "$EXPECTED_SHA"
          echo "NATIVE_AUTO_MERGE_REQUESTED sha=$EXPECTED_SHA"
