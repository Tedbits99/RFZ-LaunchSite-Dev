name: Database security tests

on:
  push:
    branches:
      - security/authorization-hardening

permissions:
  contents: read

concurrency:
  group: database-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-database-security:
    name: Isolated Supabase RPC security tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Run isolated database security tests
        run: bash scripts/test-github-actions-database-security.sh
